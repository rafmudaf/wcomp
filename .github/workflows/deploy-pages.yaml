name: deploy-pages

on:
  push:
    branches:
    - main
    paths:
    - site/**
    - dataset/**
    - .github/workflows/deploy-pages.yaml

# This job builds the Astro site (which reads the committed `dataset/`) and pushes
# the static output to `gh-pages`. No Python/solver dependencies are needed here --
# the dataset is generated locally and committed, decoupling site builds from it.
jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Install dependencies
      working-directory: site
      run: npm ci

    - name: Build the site
      working-directory: site
      run: npm run build

    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3.9.3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site/dist
